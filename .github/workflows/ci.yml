name: retrieval-tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      semantic:
        description: Download the real model and run semantic evaluation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: medlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d medlink_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/medlink_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -v -m "not semantic" --junitxml=reports/tests.xml
      - name: Real model dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.semantic }}
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-embeddings.lock
      - name: Real model evaluation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.semantic }}
        env:
          RUN_SEMANTIC_TESTS: "1"
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/medlink_test
        run: |
          pytest -v -m semantic
          medlink init-db
          medlink seed
          medlink evaluate
      - name: Package evaluated model cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.semantic }}
        run: |
          tar -C "$HOME/.cache/huggingface" -czf "$RUNNER_TEMP/hf-model-cache.tar.gz" hub
          test "$(stat -c %s "$RUNNER_TEMP/hf-model-cache.tar.gz")" -gt 100000000
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.semantic }}
        with:
          name: hf-model-cache
          path: ${{ runner.temp }}/hf-model-cache.tar.gz
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-evaluation-reports
          path: reports/
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --target app -t medlink-ai:ci .
