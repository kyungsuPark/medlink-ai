services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medlink_local_only}
      POSTGRES_DB: medlink
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlink -d medlink"]
      interval: 3s
      timeout: 3s
      retries: 20
  init:
    build:
      context: .
      target: app
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://medlink:${POSTGRES_PASSWORD:-medlink_local_only}@db:5432/medlink
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-e8f8c211226b894fcb81acc59f3b34ba3efd5f42}
      HF_HOME: /models
    volumes:
      - model_cache:/models
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "medlink init-db && medlink seed"]
  api:
    build:
      context: .
      target: app
    environment: *app_environment
    volumes:
      - model_cache:/models
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  test-db:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: medlink_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d medlink_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@test-db:5432/medlink_test
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  postgres_data:
  model_cache:
